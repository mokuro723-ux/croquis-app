<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="theme-color" content="#1e1e1e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Croquis Timer">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon.png">
    
    <title>Croquis Timer</title>
    
    <style>
        :root { 
            --bg-color: #1e1e1e; --panel-bg: #111; --text-color: #fff; --border-color: #333;
            --btn-bg: #333; --accent: #00d4ff; --hm-color: #ffb020; 
            --accent-urgent: #5be7ff;
            --app-height: 100dvh;
            --bottom-safe: 0px;
            --bottom-gap: 6px;
            --bottom-btn-pad-x: 12px;
            --bottom-btn-pad-y: 8px;
            --bottom-btn-min: 45px;
        }
        html, body { height: 100%; }
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; -webkit-touch-callout: none; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: sans-serif; display: flex; flex-direction: column; height: var(--app-height); overflow: hidden; }
        
        #top-panel { 
            position: relative; 
            height: calc(60px + env(safe-area-inset-top, 0px)); 
            background-color: var(--panel-bg); 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-end; 
            padding: 0 15px 12px 15px; 
            z-index: 100; 
            border-bottom: 1px solid var(--border-color); 
        }
        .top-left { display: flex; align-items: center; gap: 6px; flex: 1; max-width: 180px; height: 36px; }
        .top-right { display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex: 1; max-width: 150px; height: 36px; }
        #image-counter { color: #666; font-size: 0.72rem; white-space: nowrap; letter-spacing: 0.5px; }
        
        #phase-label { color: var(--hm-color); font-weight: bold; font-size: 0.8rem; white-space: nowrap; }
        #hm-step-mini { color: #777; font-size: 0.72rem; white-space: nowrap; }
        #timer-label { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); font-size: 1.8rem; font-weight: bold; text-align: center; color: var(--accent); letter-spacing: 2px; }
        
        .icon-btn { background: none; border: none; color: #aaa; cursor: pointer; padding: 5px; display: flex; justify-content: center; align-items: center; }
        .icon-btn:hover { color: #fff; }
        
        #history-panel {
            position: absolute; 
            top: calc(60px + env(safe-area-inset-top, 0px)); 
            left: 0; 
            width: 260px; 
            height: calc(var(--app-height) - 60px - env(safe-area-inset-top, 0px));
            background-color: rgba(0, 0, 0, 0.85); 
            backdrop-filter: blur(5px); 
            border-right: 1px solid var(--border-color);
            z-index: 90; 
            transform: translateX(-100%); 
            transition: transform 0.3s ease; 
            display: flex; 
            flex-direction: column;
        }
        #history-panel.open { transform: translateX(0); }
        #history-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; color: var(--accent); font-weight: bold; }
        #history-header > span { flex: 0 0 auto; white-space: nowrap; }
        #history-filter-btn { flex: 0 0 110px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #history-content { flex: 1; overflow-y: auto; padding: 10px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; align-content: start; }
        .history-thumb { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; cursor: pointer; border: 2px solid transparent; background-color: #222; }
        .history-thumb.current { border-color: var(--accent); }
        .fav-badge { position: absolute; top: 2px; right: 2px; color: gold; font-size: 12px; pointer-events: none; }

        #image-container { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; padding: 10px; overflow: hidden; touch-action: none; isolation: isolate; }
        #image-container::after {
            content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: 2px;
            box-shadow: inset 0 0 0 0 transparent;
            opacity: 0; z-index: 20;
        }
        #image-container.timer-flash::after {
            box-shadow: inset 0 0 var(--flash-blur, 60px) 12px rgba(0, 212, 255, var(--flash-alpha, 0.45));
            animation: timerFlash 0.7s ease-out forwards;
        }
        @keyframes timerFlash {
            0%   { opacity: 1; }
            100% { opacity: 0; }
        }
        #canvas-area { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        #main-image { max-width: 100%; max-height: 100%; object-fit: contain; display: none; will-change: transform; contain: layout style; }
        #grid-overlay { position: absolute; pointer-events: none; display: none; inset: 0; border: none; background-image: linear-gradient(to right, rgba(128,128,128,0.4) 1px, transparent 1px), linear-gradient(to bottom, rgba(128,128,128,0.4) 1px, transparent 1px); background-size: 33.33% 33.33%; z-index: 5; }
        #fav-icon-large { position: absolute; top: 10px; right: 10px; font-size: 2rem; color: gold; display: none; text-shadow: 0 0 5px rgba(0,0,0,0.8); z-index: 5; pointer-events: none; }
        
        #progress-container { width: 100%; height: var(--progress-height, 4px); background-color: #222; }
        #progress-bar { width: 100%; height: 100%; background-color: var(--accent); transition: background-color 0.3s; }

        #bw-bar-wrap {
            width: 100%; height: 0; overflow: hidden;
            transition: height 0.2s ease;
            background-color: rgba(0,0,0,0.6);
        }
        #bw-bar-wrap.visible { height: 32px; }
        #bw-bar-inner {
            display: flex; align-items: center; gap: 8px;
            padding: 0 12px; height: 32px;
        }
        #bw-bar-label { font-size: 0.7rem; color: #888; white-space: nowrap; }
        #bw-bar-val { font-size: 0.78rem; color: var(--accent); min-width: 20px; text-align: right; }
        #bw-bar-slider {
            -webkit-appearance: none; appearance: none; flex: 1;
            height: 3px; background: #444; border-radius: 2px; outline: none; cursor: pointer;
        }
        #bw-bar-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 16px; height: 16px;
            border-radius: 50%; background: var(--accent); cursor: pointer; border: none;
        }
        #bw-bar-slider::-moz-range-thumb {
            width: 16px; height: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; border: none;
        }
        #timer-label.urgent { color: var(--accent-urgent); animation: urgentPulse 1s ease-in-out infinite; will-change: opacity; }
        @keyframes urgentPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
        
        #bottom-panel { position: relative; background-color: var(--panel-bg); padding: 10px; display: flex; flex-wrap: wrap; justify-content: center; gap: var(--bottom-gap); border-top: 1px solid var(--border-color); transition: max-height 0.3s ease, padding 0.3s ease, opacity 0.3s ease; max-height: 250px; opacity: 1; overflow: visible; padding-bottom: calc(10px + var(--bottom-safe)); will-change: opacity; }
        #bottom-panel.hidden { max-height: 0; padding-top: 0; padding-bottom: 0; border-top: 0px solid transparent; opacity: 0; overflow: hidden; }
        #bottom-panel.idle-dim { opacity: 0.35; }
        
        button { background-color: var(--btn-bg); color: #ddd; border: none; padding: var(--bottom-btn-pad-y) var(--bottom-btn-pad-x); border-radius: 4px; cursor: pointer; min-width: var(--bottom-btn-min); display: flex; justify-content: center; align-items: center; font-size: 0.9rem;}
        button:hover { background-color: #444; }
        select:hover { background-color: #444; }
        button.active { background-color: #555; color: var(--accent); outline: 1px solid var(--accent); }
        button.accent { background-color: var(--accent); color: #000; font-weight: bold; }
        button.hard-mode { color: var(--hm-color); }
        button.hard-mode.active { background-color: var(--hm-color); color: black; outline: none; }
        button.pip-active { background-color: #00d4ff; color: #000; outline: none; }
        #image-container.drag-over { outline: 3px dashed var(--accent); outline-offset: -6px; background-color: rgba(0, 212, 255, 0.05); }
        
        .separator { color: #555; align-self: center; font-size: 1.2rem; margin: 0 4px; font-weight: 100; }
        .svg-icon { width: 20px; height: 20px; fill: currentColor; pointer-events: none; }
        
        select { outline: none; text-align: center; font-weight: bold; appearance: none; -webkit-appearance: none; padding: 8px 16px; background-color: var(--btn-bg); color: #ddd; border: none; border-radius: 4px; cursor: pointer; }
        .text-btn { font-size: 0.8rem; padding: 6px 10px; min-width: auto; font-weight: bold; }

        #manage-popup {
            position: fixed; bottom: calc(var(--bottom-safe) + 80px); left: 10px;
            background-color: rgba(22, 22, 22, 0.97);
            border: 1px solid var(--border-color); border-radius: 8px; padding: 6px;
            display: flex; flex-direction: column; gap: 4px; z-index: 150;
            opacity: 0; pointer-events: none; transform: translateY(8px);
            transition: opacity 0.18s ease, transform 0.18s ease;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            min-width: 180px;
        }
        #manage-popup.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
        #manage-popup button { justify-content: flex-start; gap: 8px; padding: 10px; font-size: 0.9rem; }

        #settings-panel {
            position: fixed; top: 0; right: 0; bottom: 0;
            width: min(300px, 90vw); background-color: var(--panel-bg); border-left: 1px solid var(--border-color);
            z-index: 300; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: -6px 0 24px rgba(0,0,0,0.6);
            transform: translateX(110%); transition: transform 0.25s ease;
            visibility: hidden; pointer-events: none;
        }
        #settings-panel.open { transform: translateX(0); visibility: visible; pointer-events: auto; }
        #settings-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 299; }
        #settings-overlay.open { display: block; }
        #settings-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 14px; border-bottom: 1px solid var(--border-color); flex-shrink: 0;
            font-size: 0.85rem; font-weight: bold; color: var(--accent); letter-spacing: 1px; text-transform: uppercase;
        }
        #settings-header button {
            background: none; border: none; color: #666; padding: 4px; cursor: pointer; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
        }
        #settings-header button:hover { color: #ccc; background-color: #333; }
        #settings-content { flex: 1; overflow-y: auto; padding: 10px 12px; }
        #settings-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 199; }
        #settings-overlay.open { display: block; }

        .settings-section { margin-bottom: 6px; }
        .settings-section-title {
            font-size: 0.7rem; color: #555; letter-spacing: 1.5px; text-transform: uppercase;
            padding: 10px 0 6px; border-bottom: 1px solid #2a2a2a; margin-bottom: 4px;
        }
        .settings-row {
            display: flex; align-items: center; justify-content: space-between;
            gap: 10px; padding: 9px 0; border-bottom: 1px solid #222;
        }
        .settings-row:last-child { border-bottom: none; }
        .settings-label { flex: 1; font-size: 0.84rem; color: #bbb; line-height: 1.4; }
        .settings-desc { display: block; font-size: 0.72rem; color: #555; margin-top: 2px; }

        /* トグルスイッチ：既存ボタンの active スタイルに合わせる */
        .settings-toggle { position: relative; display: inline-block; width: 42px; height: 22px; flex-shrink: 0; }
        .settings-toggle input { opacity: 0; width: 0; height: 0; }
        .settings-toggle-slider {
            position: absolute; inset: 0; background: #333; border-radius: 22px;
            cursor: pointer; transition: background 0.2s; border: 1px solid #444;
        }
        .settings-toggle-slider::before {
            content: ''; position: absolute; width: 16px; height: 16px;
            left: 2px; top: 2px; background: #666; border-radius: 50%; transition: transform 0.2s, background 0.2s;
        }
        .settings-toggle input:checked + .settings-toggle-slider { background: #1a3a3f; border-color: var(--accent); }
        .settings-toggle input:checked + .settings-toggle-slider::before { transform: translateX(20px); background: var(--accent); }

        /* セレクト：既存ボタンに合わせる */
        .settings-select {
            appearance: none; -webkit-appearance: none;
            background-color: var(--btn-bg); border: 1px solid #444; color: #ddd;
            border-radius: 4px; padding: 5px 10px; font-size: 0.82rem; cursor: pointer;
            text-align: center; min-width: 64px;
        }
        .settings-select:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
        .settings-row-col { flex-direction: column; align-items: flex-start; gap: 8px; }
        .settings-slider-wrap { display: flex; align-items: center; gap: 8px; width: 100%; }
        .settings-slider {
            -webkit-appearance: none; appearance: none;
            flex: 1; height: 4px; background: #444; border-radius: 2px; outline: none; cursor: pointer;
        }
        .settings-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 18px; height: 18px;
            border-radius: 50%; background: var(--accent); cursor: pointer; border: none;
        }
        .settings-slider::-moz-range-thumb {
            width: 18px; height: 18px; border-radius: 50%; background: var(--accent); cursor: pointer; border: none;
        }
        #bw-float-val { font-size: 0.82rem; color: var(--accent); min-width: 22px; text-align: right; }


        /* 全画面休憩オーバーレイ */
        #break-overlay {
            display: none; position: fixed; inset: 0;
            background: #000;
            z-index: 500; flex-direction: column; align-items: center; justify-content: center;
        }
        #break-overlay.active { display: flex; animation: breakFadeIn 0.4s ease; }
        @keyframes breakFadeIn { from { opacity: 0; } to { opacity: 1; } }

        #break-content { text-align: center; padding: 20px; }
        #break-icon { font-size: 3rem; margin-bottom: 16px; animation: breakBlink 1.5s ease-in-out 3; }
        @keyframes breakBlink { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.3; transform:scale(0.85); } }
        #break-countdown {
            font-size: 7rem; font-weight: bold; color: var(--accent);
            line-height: 1; margin-bottom: 20px;
            text-shadow: 0 0 40px rgba(0,212,255,0.6);
            animation: countPulse 1s ease-in-out infinite;
        }
        @keyframes countPulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.04); } }
        #break-message { font-size: 1.6rem; font-weight: bold; color: #fff; margin-bottom: 10px; letter-spacing: 1px; }
        #break-sub { font-size: 0.95rem; color: #555; margin-bottom: 40px; }
        #break-skip-btn {
            background: transparent; border: 1px solid #444; color: #555;
            padding: 10px 28px; border-radius: 20px; cursor: pointer;
            font-size: 0.85rem; transition: border-color 0.2s, color 0.2s;
        }
        #break-skip-btn:hover { border-color: #888; color: #aaa; }

        /* コーナー表示（長尺タイマー用） */
        #break-corner {
            display: none; position: fixed; bottom: calc(var(--bottom-safe) + 100px); right: 12px;
            background: rgba(0,0,0,0.92); border: 2px solid var(--accent);
            border-radius: 12px; padding: 12px 18px; z-index: 400;
            text-align: center; pointer-events: none;
            box-shadow: 0 0 20px rgba(0,212,255,0.3);
        }
        #break-corner.active { display: block; animation: cornerAppear 0.3s ease; }
        @keyframes cornerAppear { from { opacity:0; transform:scale(0.8) translateY(10px); } to { opacity:1; transform:scale(1) translateY(0); } }
        #break-corner-icon { font-size: 1.4rem; margin-bottom: 4px; }
        #break-corner-count { font-size: 2.4rem; font-weight: bold; color: var(--accent); line-height: 1; animation: countPulse 1s ease-in-out infinite; }
        #break-corner-msg { font-size: 0.75rem; color: #aaa; margin-top: 4px; letter-spacing: 0.5px; }
        .popup-danger { color: #ff5555 !important; }

        @media (max-width: 440px) {
            :root {
                --bottom-gap: 4px;
                --bottom-btn-pad-x: 6px;
                --bottom-btn-pad-y: 6px;
                --bottom-btn-min: 34px;
            }
            #top-panel { padding: 0 8px 12px 8px; }
            .top-left, .top-right { max-width: 130px; gap: 4px; height: 36px; }
            .icon-btn { padding: 3px; }
            .svg-icon { width: 18px; height: 18px; }
            #timer-label { font-size: 1.5rem; letter-spacing: 1px; bottom: 12px; }
            #history-panel { width: 100%; border-right: none; }
            #history-content { grid-template-columns: repeat(3, 1fr); }
            select { padding: 7px 10px; }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            :root {
                --bottom-gap: 3px;
                --bottom-btn-pad-x: 5px;
                --bottom-btn-pad-y: 4px;
                --bottom-btn-min: 30px;
            }
            #top-panel { padding: 0 8px 6px 8px; }
            #timer-label { font-size: 1.3rem; bottom: 8px; }
            #bottom-panel { padding-top: 5px; padding-bottom: calc(5px + var(--bottom-safe)); }
            .svg-icon { width: 16px; height: 16px; }
            select { padding: 5px 8px; font-size: 0.8rem; }
            .text-btn { font-size: 0.75rem; padding: 4px 7px; }
            #history-panel { width: 60%; }
        }
    </style>
</head>
<body>
    <div id="top-panel">
        <div class="top-left">
            <button class="icon-btn" onclick="toggleHistoryPanel()" title="履歴"><svg viewBox="0 0 24 24" class="svg-icon"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg></button>
            <button class="icon-btn" id="settings-btn" onclick="toggleSettingsPanel()" title="設定"><svg viewBox="0 0 24 24" class="svg-icon"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a6.97 6.97 0 0 0-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54a7.32 7.32 0 0 0-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.47.47 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54a7.32 7.32 0 0 0 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.47.47 0 0 0-.12-.61zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
            <div id="image-counter"></div>
            <div id="phase-label"></div>
            <div id="hm-step-mini"></div>
            <button class="text-btn" id="btn-hm-show" onclick="isImageHidden=false; applyFilters();" style="display:none;">表示</button>
            <button class="text-btn" id="btn-hm-hide" onclick="isImageHidden=true; applyFilters();" style="display:none;">隠す</button>
        </div>
        <div id="timer-label">00:30</div>
        <div class="top-right">
            <button class="icon-btn" id="bg-btn" onclick="cycleBg()" title="背景色"><svg viewBox="0 0 24 24" class="svg-icon"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg></button>
            <button class="icon-btn" id="mute-btn" onclick="toggleMute()" title="音切替">
                <svg viewBox="0 0 24 24" class="svg-icon" id="icon-vol"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
            </button>
            <button class="icon-btn" onclick="toggleBottomPanel()" title="メニュー開閉"><svg viewBox="0 0 24 24" class="svg-icon"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
        </div>
    </div>

    <div id="history-panel">
        <div id="history-header">
            <span>履歴管理</span>
            <button id="history-filter-btn" onclick="toggleHistoryFilter()" style="background-color:#444; color:#fff; font-size:0.75rem; padding:4px 10px; min-width:auto; font-weight:bold; border-radius:4px;">全て (履歴)</button>

        let skipList = (function(){ try { return JSON.parse(localStorage.getItem('croquis_skips') || '[]'); } catch(_){ return []; } })();

        const settingsKey = 'croquis_ui_settings_v1';

        let pipVideo, pipCanvas, pipCtx, isPiP = false, pipInitialized = false;

        let pipRenderStamp = '';

        let db; const dbName = "CroquisAppDB", storeName = "favorites";

        const hasMediaSession = 'mediaSession' in navigator;
        const bgColors = ['#1e1e1e', '#000', '#fff'];

        // SVGアイコンの定義
        const iconPlaySVG = `<svg viewBox="0 0 24 24" class="svg-icon"><path d="M8 5v14l11-7z"/></svg>`;

        const iconMuteSVG = `<svg viewBox="0 0 24 24" class="svg-icon"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>`;

        const ui = {
            img: document.getElementById('main-image'), timer: document.getElementById('timer-label'),
            prog: document.getElementById('progress-bar'), playBtn: document.getElementById('play-btn'),
            grid: document.getElementById('grid-overlay'), sound: document.getElementById('sound-player'),
            phase: document.getElementById('phase-label'), hmBtn: document.getElementById('hm-btn'),
            btnHmShow: document.getElementById('btn-hm-show'), btnHmHide: document.getElementById('btn-hm-hide'),
            muteBtn: document.getElementById('mute-btn'), pipBtn: document.getElementById('pip-btn'),
            favIcon: document.getElementById('fav-icon-large'), managePopup: document.getElementById('manage-popup'),

            bottomPanel: document.getElementById('bottom-panel')
        };
        function updateHmMini() {
            if (!hmActive) { ui.hmMini.innerText = ''; return; }
            const active = hmPhase || 1;
            const parts = ['①','②','③','④'].map(function(mark, idx) {
                const n = idx + 1;
                return n === active ? '[' + mark + ']' : mark;
            });
            ui.hmMini.innerText = parts.join('');
        }

        function initDB() {
            return new Promise((resolve) => {
                let request = indexedDB.open(dbName, 1);
                request.onupgradeneeded = function(e) { e.target.result.createObjectStore(storeName, { keyPath: "name" }); };
                request.onsuccess = function(e) { db = e.target.result; resolve(); };
                request.onerror = function() { resolve(); };
            });
        }
        function saveFavToDB(name, dataUrl) {
            if (!db) return;
            const tx = db.transaction(storeName, "readwrite");
            tx.onerror = function() {};
            tx.objectStore(storeName).put({ name: name, data: dataUrl, timestamp: Date.now() });
        }
        function deleteFavFromDB(name) {
            if (!db) return;
            const tx = db.transaction(storeName, "readwrite");
            tx.onerror = function() {};
            tx.objectStore(storeName).delete(name);
        }
        function getAllFavsFromDB() {
            return new Promise((resolve) => {
                if (!db) { resolve([]); return; }
                let request = db.transaction(storeName, "readonly").objectStore(storeName).getAll();
                request.onsuccess = function() { resolve(request.result || []); };
                request.onerror = function() { resolve([]); };
            });
        }
        let skipSaveTimer = null;
        function saveSkipList() {
            if (skipSaveTimer) clearTimeout(skipSaveTimer);
            skipSaveTimer = setTimeout(function() {
                try { localStorage.setItem('croquis_skips', JSON.stringify(skipList)); } catch(_) {}
                skipSaveTimer = null;
            }, 120);
        }
        function rebuildFavNameSet() { favNameSet = new Set(dbFavImages.map(function(f){ return f.name; })); }
        function rebuildSkipNameSet() { skipNameSet = new Set(skipList); }
        function hasUnskippedInCurrentPool() {
            if (isFavMode) return true;
            if (!images || images.length === 0) return false;
            for (let i = 0; i < images.length; i++) {
                const name = images[i] && images[i].name;
                if (!name || !skipNameSet.has(name)) return true;
            }
            return false;
        }

        function isIOSDevice() {
            return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.userAgent));
        }
        function checkDevice() {
            if (isIOSDevice()) { ui.pipBtn.style.display = 'none'; }
        }
        function syncAppHeight() {
            const vv = window.visualViewport;
            const innerH = window.innerHeight || 0;
            const vvH = vv ? vv.height : 0;
            const h = (vvH > 0) ? Math.min(innerH || vvH, vvH) : innerH;
            if (!h) return;
            document.documentElement.style.setProperty('--app-height', h + 'px');

            const isStandalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
            const isIOS = isIOSDevice();
            let safe = 0;
            if (isStandalone && isIOS && innerH > 0 && vvH > 0) {
                safe = Math.max(0, Math.round(innerH - vvH));
                if (safe > 40) safe = 0;
            }
            document.documentElement.style.setProperty('--bottom-safe', safe + 'px');
        }

        function flushUiSettings() {
            const payload = {
                settings: settings,
                bgMode: bgMode,
                isMuted: isMuted,
                isEyeHideEnabled: isEyeHideEnabled,
                randomFlipEnabled: randomFlipEnabled,
                breakReminderEnabled: breakReminderEnabled,
                eyeHideDelay: eyeHideDelay,
                focusIdleDelay: focusIdleDelay,
                breakIntervalMin: breakIntervalMin,
                breakDurationSec: breakDurationSec,
                flashIntensity: flashIntensity,
                progressBarSize: progressBarSize,
                soundVolume: soundVolume,
                bwContrast: bwContrast
            };
            try { localStorage.setItem(settingsKey, JSON.stringify(payload)); } catch (_) {}
        }
        function saveUiSettings() {
            if (saveTimer) clearTimeout(saveTimer);
            saveTimer = setTimeout(function() {
                flushUiSettings();
                saveTimer = null;
            }, 120);
        }

        function loadUiSettings() {
            try {
                const raw = localStorage.getItem(settingsKey);
                if (!raw) return;
                const saved = JSON.parse(raw);
                if (saved && saved.settings) {
                    settings.flipH = !!saved.settings.flipH;
                    settings.flipV = !!saved.settings.flipV;
                    settings.shuffle = saved.settings.shuffle !== false;
                    settings.grid = !!saved.settings.grid;
                    settings.mono = !!saved.settings.mono;
                    settings.bw = !!saved.settings.bw;
                }
                if (saved && typeof saved.bgMode === 'number') bgMode = Math.max(0, Math.min(2, saved.bgMode));
                if (saved && typeof saved.isEyeHideEnabled === 'boolean') isEyeHideEnabled = saved.isEyeHideEnabled;
                if (saved && typeof saved.randomFlipEnabled === 'boolean') randomFlipEnabled = saved.randomFlipEnabled;
                if (saved && typeof saved.breakReminderEnabled === 'boolean') {
                    breakReminderEnabled = saved.breakReminderEnabled;
                }
                if (saved && typeof saved.eyeHideDelay === 'number') eyeHideDelay = saved.eyeHideDelay;
                if (saved && typeof saved.focusIdleDelay === 'number') focusIdleDelay = saved.focusIdleDelay;
                if (saved && typeof saved.breakIntervalMin === 'number') breakIntervalMin = saved.breakIntervalMin;
                if (saved && typeof saved.breakDurationSec === 'number') breakDurationSec = saved.breakDurationSec;
                if (saved && typeof saved.bwContrast === 'number') bwContrast = Math.max(1, Math.min(20, saved.bwContrast));
                if (saved && typeof saved.flashIntensity === 'number') flashIntensity = saved.flashIntensity;
                if (saved && typeof saved.progressBarSize === 'number') progressBarSize = saved.progressBarSize;
                if (saved && typeof saved.soundVolume === 'number') {
                    soundVolume = Math.max(0, Math.min(2, saved.soundVolume));
                    isMuted = (soundVolume === 0);
                } else if (saved && typeof saved.isMuted === 'boolean') {
                    // 旧データ互換: isMutedだけ保存されていた場合
                    isMuted = saved.isMuted;
                    soundVolume = isMuted ? 0 : 2;
                }
            } catch (_) {}
        }

        function reflectUiSettings() {
            ['shuffle', 'flipH', 'flipV', 'grid', 'mono'].forEach(function(k) {
                const btn = document.getElementById(k + '-btn');
                if (!btn) return;
                if (settings[k]) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            if (settings.bw) {
                const b = document.getElementById('bw-btn'); if(b) b.classList.add('active');
                const bbar = document.getElementById('bw-bar-wrap'); if(bbar) bbar.classList.add('visible');
            }
            const breakToggle = document.getElementById('break-reminder-toggle');
            if (breakToggle) breakToggle.checked = breakReminderEnabled;
            const eyeSel = document.getElementById('eye-hide-delay-select');
            if (eyeSel) eyeSel.value = eyeHideDelay;
            const focusSel = document.getElementById('focus-idle-delay-select');
            if (focusSel) focusSel.value = focusIdleDelay;
            const brkIntSel = document.getElementById('break-interval-select');
            if (brkIntSel) brkIntSel.value = breakIntervalMin;
            const brkDurSel = document.getElementById('break-duration-select');
            if (brkDurSel) brkDurSel.value = breakDurationSec;
            const flashSel = document.getElementById('flash-intensity-select');
            if (flashSel) flashSel.value = flashIntensity;
            const progSel = document.getElementById('progress-size-select');
            if (progSel) { progSel.value = progressBarSize; onProgressSizeChange(progressBarSize); }
            const sndSel = document.getElementById('sound-volume-select');
            if (sndSel) sndSel.value = soundVolume;
            const bwSlider = document.getElementById('bw-contrast-slider');
            if (bwSlider) { bwSlider.value = bwContrast; }
            const bwVal = document.getElementById('bw-contrast-val');
            if (bwVal) bwVal.textContent = bwContrast;
            const bwBarSlider = document.getElementById('bw-bar-slider');
            if (bwBarSlider) bwBarSlider.value = bwContrast;
            const bwBarVal = document.getElementById('bw-bar-val');
            if (bwBarVal) bwBarVal.textContent = bwContrast;
            if (isEyeHideEnabled) ui.eyeBtn.classList.add('active');
            else ui.eyeBtn.classList.remove('active');
            const rfBtn = document.getElementById('randomFlip-btn');
            if (rfBtn) {
                if (randomFlipEnabled) {
                    rfBtn.classList.add('active');
                    document.getElementById('flipH-btn').classList.add('flip-disabled');
                    document.getElementById('flipV-btn').classList.add('flip-disabled');
                } else {
                    rfBtn.classList.remove('active');
                    document.getElementById('flipH-btn').classList.remove('flip-disabled');
                    document.getElementById('flipV-btn').classList.remove('flip-disabled');
                }
            }
            ui.muteBtn.innerHTML = isMuted ? iconMuteSVG : iconVolSVG;
            document.documentElement.style.setProperty('--bg-color', bgColors[bgMode]);
        }

        window.onload = async function() {
            loadUiSettings();
            checkDevice(); await initDB(); dbFavImages = await getAllFavsFromDB(); rebuildFavNameSet(); initMediaSession();
            reflectUiSettings();
            syncAppHeight();
            document.addEventListener('visibilitychange', handleVisibilityChange);
            window.addEventListener('resize', syncAppHeight, { passive: true });
            window.addEventListener('orientationchange', function() {
                syncAppHeight();
                setTimeout(syncAppHeight, 100);
                setTimeout(syncAppHeight, 300);
            }, { passive: true });
            if (window.visualViewport) window.visualViewport.addEventListener('resize', syncAppHeight, { passive: true });
            armFocusIdleTimer();
        };

        function handleVisibilityChange() {
            if (document.hidden) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
                // PiP中でない場合はtimerTickLoopも停止して電力消費を抑える
                if (!isPiP && timerTickId) {
                    clearTimeout(timerTickId); timerTickId = null;
                }
            } else {
                if (isRunning) {
                    const now = Date.now();
                    if (expectedEndTime <= now) {
                        remaining = 0;
                        updateTimerText(0);
                        ui.prog.style.width = '0%';
                        flashScreen();
                        hmActive ? hmNextPhase() : nextImage();
                        return;
                    }
                    remaining = Math.ceil((expectedEndTime - now) / 1000);
                    updateTimerText(remaining);
                    // バックグラウンドで止まっていた場合は再起動
                    if (!timerTickId) timerTickLoop();
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = requestAnimationFrame(updateSmoothTimerRAF);
                }
                // スリープ復帰時にDocument PiPが消えていたら自動再接続
                if (isPiP && !documentPipWindow && 'documentPictureInPicture' in window) {
                    setTimeout(function() {
                        if (isPiP && !documentPipWindow) togglePiP();
                    }, 600);
                }
                // Video PiP復帰: document PiP非対応環境でPiPフラグが残っていたら再接続
                if (isPiP && !documentPipWindow && !('documentPictureInPicture' in window) && pipInitialized) {
                    setTimeout(function() {
                        if (isPiP && !document.pictureInPictureElement) {
                            pipVideo.requestPictureInPicture().catch(function(){
                                isPiP = false; ui.pipBtn.classList.remove('pip-active');
                            });
                        }
                    }, 600);
                }

                if (isPiP) updatePiP();
            }
        }

        let eyeHideDelay = 5;      // ① 画像を隠すまでの秒数
        let focusIdleDelay = 5;    // ② フォーカスモードが暗くなるまでの秒数（0=無効）
        let breakIntervalMin = 15; // ③ 休憩インターバル（分）
        let breakDurationSec = 20; // ④ 休憩時間（秒）
        let flashIntensity = 2;    // ⑥ 0=なし 1=弱 2=中 3=強
        let progressBarSize = 2;   // ⑧ 1=細 2=中 3=太
        let soundVolume = 2;       // ⑩ 0=なし 1=小 2=中
        let bwContrast = 10;       // 2階調コントラスト強度（1〜20）

        // ---- 休憩リマインダー ----
        let breakReminderEnabled = false;

        function readEntryFile(entry) {
            return new Promise(function(resolve) {
                try {
                    entry.file(function(file) { resolve(file || null); }, function() { resolve(null); });
                } catch (_) { resolve(null); }
            });
        }
        function readDirEntries(reader) {
            return new Promise(function(resolve) {
                const all = [];
                const loop = function() {
                    reader.readEntries(function(entries) {
                        if (!entries || entries.length === 0) { resolve(all); return; }
                        for (let i = 0; i < entries.length; i++) all.push(entries[i]);
                        loop();
                    }, function() { resolve(all); });
                };
                loop();
            });
        }
        async function collectImageFilesFromEntry(entry, out) {
            if (!entry) return;
            if (entry.isFile) {
                const file = await readEntryFile(entry);
                if (file && file.type && file.type.startsWith('image/')) out.push(file);
                return;
            }
            if (entry.isDirectory) {
                const reader = entry.createReader();
                const children = await readDirEntries(reader);
                for (let i = 0; i < children.length; i++) {
                    await collectImageFilesFromEntry(children[i], out);
                }
            }
        }
        async function getDroppedImageFiles(dataTransfer) {
            const out = [];
            const items = dataTransfer && dataTransfer.items ? dataTransfer.items : null;
            if (items && items.length > 0) {
                const entries = [];
                for (let i = 0; i < items.length; i++) {
                    const it = items[i];
                    const entry = it.webkitGetAsEntry ? it.webkitGetAsEntry() : null;
                    if (entry) { entries.push(entry); }
                    else {
                        const f = it.getAsFile ? it.getAsFile() : null;
                        if (f && f.type && f.type.startsWith('image/')) out.push(f);
                    }
                }
                // 直列処理でフォルダ内の順序を安定させる
                for (let i = 0; i < entries.length; i++) {
                    await collectImageFilesFromEntry(entries[i], out);
                }
                return out;
            }
            const files = dataTransfer && dataTransfer.files ? dataTransfer.files : [];
            for (let i = 0; i < files.length; i++) {
                const f = files[i];
                if (f && f.type && f.type.startsWith('image/')) out.push(f);
            }
            return out;
        }

        function updatePreloadQueue() {
            if (images.length === 0) return;
            const firstIdx = getNextIndexForPreload();
            if (firstIdx < 0 || !images[firstIdx]) return;
            const firstItem = images[firstIdx];
            const firstName = firstItem.name || '';

            // 両スロットが既に同じ画像をプリロード済みなら早期リターン
            let secondIdx = -1;
            if (images.length > 1) {
                if (settings.shuffle) {
                    let guard = 0;
                    secondIdx = Math.floor(Math.random() * images.length);
                    while ((secondIdx === firstIdx || secondIdx === currentIndex) && guard < 16) {
                        secondIdx = Math.floor(Math.random() * images.length);
                        guard++;
                    }
                } else {
                    secondIdx = (firstIdx + 1) % images.length;
                }
            }

            if (!(preloadName === firstName && preloadUrl)) {
                if (preloadUrl && preloadUrl.startsWith('blob:')) URL.revokeObjectURL(preloadUrl);
                preloadName = firstName;
                preloadedImage = null;
                preloadUrl = firstItem.data ? firstItem.data : URL.createObjectURL(firstItem);
                const img1 = new Image();
                img1.onload = function() {
                    preloadedImage = img1;
                    if (img1.decode) img1.decode().catch(function(){});
                };
                img1.onerror = function() { preloadedImage = null; };
                img1.src = preloadUrl;
            }

            if (secondIdx >= 0 && images[secondIdx]) {
                const secondItem = images[secondIdx];
                const secondName = secondItem.name || '';
                if (!(preloadName2 === secondName && preloadUrl2)) {
                    if (preloadUrl2 && preloadUrl2.startsWith('blob:')) URL.revokeObjectURL(preloadUrl2);
                    preloadName2 = secondName;
                    preloadedImage2 = null;

                    };
                    img2.onerror = function() { preloadedImage2 = null; };
                    img2.src = preloadUrl2;
                }
            } else {
                if (preloadUrl2 && preloadUrl2.startsWith('blob:')) URL.revokeObjectURL(preloadUrl2);
                preloadUrl2 = null; preloadName2 = ''; preloadedImage2 = null;
            }
        }

            }

            let newUrl;
            if (item.data) {
                newUrl = item.data;
            } else if (preloadName === item.name && preloadUrl) {
                // deocde完了前でもURLを流用（createObjectURL節約）
                newUrl = preloadUrl; preloadUrl = null; preloadedImage = null; preloadName = '';
            } else if (preloadName2 === item.name && preloadUrl2) {
                newUrl = preloadUrl2; preloadUrl2 = null; preloadedImage2 = null; preloadName2 = '';
            } else {
                newUrl = URL.createObjectURL(item);
            }
            // 前のURLを解放（ただしプリロードURLと同じなら解放しない）
            if (currentImageUrl && currentImageUrl.startsWith('blob:') && currentImageUrl !== newUrl) {
                URL.revokeObjectURL(currentImageUrl);
            }
            currentImageUrl = newUrl;

            // decodeが使える環境では、デコード完了後に表示＆タイマー開始
            if ('decode' in ui.img) {

                    if (pendingTimerStart) {

                        timerTickLoop();
                        if (!document.hidden) animationFrameId = requestAnimationFrame(updateSmoothTimerRAF);
                    }
                }).catch(function() {
                    // decodeが失敗した場合はonloadに任せる
                    if (loadToken !== imageLoadToken) return;
                    pendingTimerStart = false;
                    if (images.length > 1) nextImage();
                });
            } else {
                // decode非対応ブラウザはonloadで処理（従来の動作）
                ui.img.src = currentImageUrl;
                if (ui.img.complete && ui.img.naturalWidth > 0) {

                    if (pendingTimerStart) {

        function mountVirtualHistory(items, buildNode) {
            const content = ui.historyContent;
            const cols = window.innerWidth <= 440 ? 3 : 2;
            const gap = 8;
            const paddingX = 20;
            const usable = Math.max(1, content.clientWidth - paddingX);
            const tile = Math.floor((usable - (gap * (cols - 1))) / cols);
            const rowHeight = tile + gap;
            const totalRows = Math.ceil(items.length / cols);
            const layer = document.createElement('div');
            layer.style.position = 'relative';

            layer.style.width = '100%';
            content.innerHTML = '';

            content.style.position = 'relative';

            let lastEnd = -1;

            const renderVisible = function() {
                const viewTop = content.scrollTop;
                const viewBottom = viewTop + content.clientHeight;
                const startRow = Math.max(0, Math.floor(viewTop / rowHeight) - 2);
                const endRow = Math.min(totalRows, Math.ceil(viewBottom / rowHeight) + 2);
                const start = startRow * cols;
                const end = Math.min(items.length, endRow * cols);
                if (start === lastStart && end === lastEnd) return;
                lastStart = start;
                lastEnd = end;
                layer.innerHTML = '';
                for (let i = start; i < end; i++) {
                    const col = i % cols;
                    const row = Math.floor(i / cols);
                    const node = buildNode(items[i], i);
                    node.style.position = 'absolute';
                    node.style.left = (col * (tile + gap)) + 'px';
                    node.style.top = (row * rowHeight) + 'px';
                    node.style.width = tile + 'px';
                    node.style.height = tile + 'px';
                    layer.appendChild(node);

                const artist = '残り: ' + lastTimerText;
                const album = isFavMode ? '★ お気に入り' : '通常再生';
                const stamp = title + '|' + album + '|' + (isRunning ? '1' : '0');
                if (updateMediaSession.lastStamp === stamp) return;
                updateMediaSession.lastStamp = stamp;
                navigator.mediaSession.metadata = new MediaMetadata({ title: title, artist: artist, album: album });
                navigator.mediaSession.playbackState = isRunning ? "playing" : "paused";
            }
        }

        function initPiP() {
            if(pipInitialized) return true;
            try {
                pipVideo = document.createElement('video'); pipVideo.muted = true; pipVideo.playsInline = true;
                pipVideo.style.position = 'fixed'; pipVideo.style.left = '-9999px'; pipVideo.style.opacity = '0'; pipVideo.style.pointerEvents = 'none';
                document.body.appendChild(pipVideo); pipCanvas = document.createElement('canvas'); pipCtx = pipCanvas.getContext('2d', { alpha: false });
                
                pipVideo.addEventListener('play', function() { if (isPiP && !isRunning) startTimer(); });
                pipVideo.addEventListener('pause', function() { if (isPiP && isRunning) stopTimer(); });
                pipVideo.addEventListener('leavepictureinpicture', function() { if(!documentPipWindow) { isPiP = false; ui.pipBtn.classList.remove('pip-active'); } });
                pipVideo.addEventListener('enterpictureinpicture', function() {
                    isPiP = true; ui.pipBtn.classList.add('pip-active'); updatePiP();
                });
                pipInitialized = true; return true;
            } catch(e) { return false; }
        }

        async function togglePiP() {
            if (images.length === 0) { alert("画像を読み込んでください"); return; }
            
            // 1. 新技術 Document Picture-in-Picture API によるクリック可能な完全なUI実装
            if ('documentPictureInPicture' in window) {
                if (documentPipWindow) { documentPipWindow.close(); return; }
                try {
                    const nw = ui.img.naturalWidth, nh = ui.img.naturalHeight;
                    const ratio = (nw && nh) ? nw / nh : 4 / 3;
                    const pipWidth = Math.max(400, Math.min(800, window.innerWidth * 0.8));
                    const pipHeight = (pipWidth / ratio) + 60;
                    
                    documentPipWindow = await documentPictureInPicture.requestWindow({ width: Math.round(pipWidth), height: Math.round(pipHeight) });
                    
                    const pipDoc = documentPipWindow.document;
                    const currentBg = bgMode === 0 ? '#1e1e1e' : (bgMode === 1 ? '#000' : '#fff');
                    
                    pipDoc.body.innerHTML = `
                        <style>
                            body { margin:0; background-color:${currentBg}; display:flex; flex-direction:column; height:100vh; overflow:hidden; color:#fff; font-family:sans-serif; user-select:none; }
                            #canvas-container { flex:1; display:flex; justify-content:center; align-items:center; position:relative; overflow:hidden; background-color: transparent; }
                            #canvas-container::after { content:''; position:absolute; inset:0; pointer-events:none; opacity:0; box-shadow:inset 0 0 var(--flash-blur, 60px) 12px rgba(0,212,255,var(--flash-alpha, 0.45)); }
                            #canvas-container.timer-flash::after { animation: timerFlash 0.7s ease-out forwards; }
                            @keyframes timerFlash { 0% { opacity:1; } 100% { opacity:0; } }
                            canvas { max-width:100%; max-height:100%; object-fit:contain; }
                            #controls { height:60px; background-color:#111; display:flex; justify-content:center; align-items:center; gap:25px; border-top:1px solid #333; }
                            button { background-color:#222; border:none; color:#ddd; cursor:pointer; display:flex; justify-content:center; align-items:center; width:44px; height:44px; border-radius:50%; transition:background 0.2s; outline:none; touch-action:none; -webkit-user-select:none; user-select:none; }
                            button:hover { background-color:#444; }
                            button:active { transform: scale(0.95); }
                            svg { width:24px; height:24px; fill:currentColor; pointer-events:none; }
                            #pip-play-btn.paused { color: #00d4ff; border: 1px solid #00d4ff; background-color: #1a1a1a; }
                        </style>
                        <div id="canvas-container"><canvas></canvas></div>
                        <div id="controls">
                            <button id="pip-prev-btn" title="戻る">${iconPrevSVG}</button>
                            <button id="pip-play-btn" class="${isRunning ? '' : 'paused'}" title="再生/一時停止">${isRunning ? iconPauseSVG : iconPlaySVG}</button>
                            <button id="pip-next-btn" title="次へ">${iconNextSVG}</button>
                        </div>
                    `;
                    
                    // onclick は pointerup と二重発火するため削除し、pointer系イベントのみで制御
                    // pointerId でトラッキングして確実に1回だけ実行
                    function addPipBtnHandler(id, fn) {
                        const btn = pipDoc.getElementById(id);
                        if (!btn) return;
                        let activePointerId = null;

                        btn.addEventListener('pointerdown', function(e) {
                            e.preventDefault();
                            btn.setPointerCapture(e.pointerId);
                            activePointerId = e.pointerId;
                        }, { passive: false });

                        btn.addEventListener('pointerup', function(e) {
                            if (activePointerId === e.pointerId) {
                                activePointerId = null;
                                // ボタン領域内でのpointerupのみ実行
                                const rect = btn.getBoundingClientRect();
                                if (e.clientX >= rect.left && e.clientX <= rect.right &&
                                    e.clientY >= rect.top && e.clientY <= rect.bottom) {
                                    fn();
                                }
                            }
                        });

                        btn.addEventListener('pointercancel', function(e) {
                            if (activePointerId === e.pointerId) activePointerId = null;
                        });
                    }
                    addPipBtnHandler('pip-prev-btn', function(){ prevImage(); });
                    addPipBtnHandler('pip-play-btn', function(){ toggleTimer(); });
                    addPipBtnHandler('pip-next-btn', function(){ nextImage(); });
                    
                    function onPipPageHide() { documentPipWindow = null; isPiP = false; ui.pipBtn.classList.remove('pip-active'); }
                    documentPipWindow.addEventListener('pagehide', onPipPageHide);
                    
                    isPiP = true; ui.pipBtn.classList.add('pip-active'); updatePiP();
                    return;
                } catch(e) { console.warn("Document PiP failed. Falling back to Video PiP", e); }
            }

            // 2. 非対応ブラウザ（iOS/Safariなど）へのVideo PiPフォールバック
            if (!initPiP() || typeof pipCanvas.captureStream !== 'function') { alert("お使いの環境はPiP機能に対応していません。"); return; }
            if (document.pictureInPictureElement) { await document.exitPictureInPicture().catch(function(){}); } 
            else {
                try {
                    if (!pipVideo.srcObject) { pipVideo.srcObject = pipCanvas.captureStream(1); }
                    isPiP = true; updatePiP(); 
                    if(isRunning) { await pipVideo.play(); } else { pipVideo.pause(); }
                    await pipVideo.requestPictureInPicture(); updateMediaSession();
                } catch (error) { isPiP = false; }
            }
        }

        function drawToCanvas(canvas, ctx, drawOverlay) {
            const nw = ui.img.naturalWidth, nh = ui.img.naturalHeight;
            if (!nw || !nh) return;
            const ratio = nw / nh;
            const maxW = canvas === pipCanvas ? 2560 : 1200;
            const baseWidth = Math.min(Math.max(nw, maxW), maxW);
            const targetH = Math.round(baseWidth / ratio);
            if (canvas.width !== baseWidth || canvas.height !== targetH) {
                canvas.width = baseWidth; canvas.height = targetH;
            }
            ctx.fillStyle = bgMode === 0 ? '#1e1e1e' : (bgMode === 1 ? '#000' : '#fff'); ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            if(!isImageHidden) {
                ctx.translate(canvas.width/2, canvas.height/2);
                if(settings.flipH) ctx.scale(-1, 1); if(settings.flipV) ctx.scale(1, -1);
                if (settings.bw) ctx.filter = 'grayscale(1) contrast(' + bwContrast + ')';
                else if(settings.mono) ctx.filter = 'grayscale(100%)';
                ctx.drawImage(ui.img, -canvas.width/2, -canvas.height/2, canvas.width, canvas.height);
                if(settings.grid) {
                    ctx.filter = 'none'; ctx.strokeStyle = 'rgba(128,128,128,0.4)'; ctx.lineWidth = Math.max(2, canvas.width / 200);
                    ctx.beginPath(); 
                    ctx.moveTo(-canvas.width/6, -canvas.height/2); ctx.lineTo(-canvas.width/6, canvas.height/2);
                    ctx.moveTo(canvas.width/6, -canvas.height/2); ctx.lineTo(canvas.width/6, canvas.height/2);
                    ctx.moveTo(-canvas.width/2, -canvas.height/6); ctx.lineTo(canvas.width/2, -canvas.height/6);
                    ctx.moveTo(-canvas.width/2, canvas.height/6); ctx.lineTo(canvas.width/2, canvas.height/6);
                    ctx.stroke();
                }
            }
            ctx.restore();
            if (drawOverlay) {
                const barHeight = Math.max(4, canvas.height * 0.015); const totalMs = (hmActive ? hmPhases[hmPhase].s : timerSeconds) * 1000; 
                const remainMs = isRunning ? Math.max(0, expectedEndTime - Date.now()) : (remaining * 1000);
                const progWidth = (remainMs / totalMs) * canvas.width;
                
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)'; ctx.fillRect(0, canvas.height - barHeight, canvas.width, barHeight);
                const barColor = remaining <= 10 ? '#5be7ff' : '#00d4ff';
                ctx.fillStyle = barColor; ctx.fillRect(0, canvas.height - barHeight, progWidth, barHeight);

                const fontSize = Math.max(16, canvas.height * 0.04);
                ctx.font = "bold " + fontSize + "px sans-serif"; ctx.textBaseline = 'top'; ctx.textAlign = 'right';
                let sec = Math.ceil(remainMs / 1000); let m = Math.floor(sec / 60); let s = sec % 60; const timeText = (m < 10 ? '0'+m : m) + ':' + (s < 10 ? '0'+s : s);
                
                ctx.shadowColor = "rgba(0,0,0,0.8)"; ctx.shadowBlur = 6; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
                ctx.fillStyle = remaining <= 10 ? '#5be7ff' : '#00d4ff';
                ctx.fillText(timeText, canvas.width - 20, 20);
                ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
            }
        }

        function updatePiP() {
            if (!isPiP || !ui.img.complete || ui.img.naturalWidth === 0) return;
            const stamp = [
                currentIndex, remaining, isRunning ? 1 : 0, isImageHidden ? 1 : 0,
                settings.flipH ? 1 : 0, settings.flipV ? 1 : 0, settings.grid ? 1 : 0, settings.mono ? 1 : 0, settings.bw ? 1 : 0,
                hmActive ? hmPhase : 0, bgMode
            ].join('|');
            if (pipRenderStamp === stamp) return;
            pipRenderStamp = stamp;
            
            if (documentPipWindow) {
                const canvas = documentPipWindow.document.querySelector('canvas');
                if (canvas) {
                    const ctx = canvas.getContext('2d');
                    drawToCanvas(canvas, ctx, true); 
                }
                const playBtn = documentPipWindow.document.getElementById('pip-play-btn');
                if (playBtn) {
                    playBtn.innerHTML = isRunning ? iconPauseSVG : iconPlaySVG;
                    if(isRunning) { playBtn.classList.remove('paused'); } 
                    else { playBtn.classList.add('paused'); }
                }
            } else if (pipInitialized && pipVideo) {
                drawToCanvas(pipCanvas, pipCtx, true);
            }
        }

        let pointerStartX = 0; let pointerStartY = 0; let lastTapTime = 0; const imgContainer = document.getElementById('image-container');
        let prevLongPressTimer = null, nextLongPressTimer = null;
        let prevLongPressHandled = false, nextLongPressHandled = false;
        let prevPressStartX = 0, prevPressStartY = 0, nextPressStartX = 0, nextPressStartY = 0;
        function handlePrevButtonClick(e) {
            if (prevLongPressHandled) { prevLongPressHandled = false; if (e) e.preventDefault(); return; }
            prevImage();
        }
        function handleNextButtonClick(e) {
            if (nextLongPressHandled) { nextLongPressHandled = false; if (e) e.preventDefault(); return; }
            nextImage();
        }
        function onPressStart(btn, which, startX, startY) {
            const delay = 450;
            if (which === 'next') { nextPressStartX = startX; nextPressStartY = startY; }
            else { prevPressStartX = startX; prevPressStartY = startY; }
            const timer = setTimeout(function() {
                if (which === 'next') { nextLongPressHandled = true; skipCurrent(); }
                else if (which === 'prev') {
                    prevLongPressHandled = true;
                    if (images.length === 0 || isFavMode) return;
                    const fname = images[currentIndex] && images[currentIndex].name;
                    if (!fname || !skipNameSet.has(fname)) return;
                    skipList = skipList.filter(function(n){ return n !== fname; });
                    rebuildSkipNameSet();
                    saveSkipList();
                    alert("この画像のスキップを解除しました");
                }
            }, delay);
            if (which === 'next') nextLongPressTimer = timer;
            else prevLongPressTimer = timer;
        }
        function onPressEnd(which) {
            if (which === 'next' && nextLongPressTimer) { clearTimeout(nextLongPressTimer); nextLongPressTimer = null; }
            if (which === 'prev' && prevLongPressTimer) { clearTimeout(prevLongPressTimer); prevLongPressTimer = null; }
        }
        (function bindLongPressButtons(){
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            if (!prevBtn || !nextBtn) return;
            prevBtn.addEventListener('pointerdown', function(e){ onPressStart(prevBtn, 'prev', e.clientX, e.clientY); }, { passive: true });
            prevBtn.addEventListener('pointerup', function(){ onPressEnd('prev'); }, { passive: true });
            prevBtn.addEventListener('pointerleave', function(){ onPressEnd('prev'); }, { passive: true });
            prevBtn.addEventListener('pointercancel', function(){ onPressEnd('prev'); }, { passive: true });
            nextBtn.addEventListener('pointerdown', function(e){ onPressStart(nextBtn, 'next', e.clientX, e.clientY); }, { passive: true });
            nextBtn.addEventListener('pointerup', function(){ onPressEnd('next'); }, { passive: true });
            nextBtn.addEventListener('pointerleave', function(){ onPressEnd('next'); }, { passive: true });
            nextBtn.addEventListener('pointercancel', function(){ onPressEnd('next'); }, { passive: true });
        })();
        document.addEventListener('pointermove', function(e) {
            const moveThreshold = 14;
            if (nextLongPressTimer) {
                if (Math.abs(e.clientX - nextPressStartX) > moveThreshold || Math.abs(e.clientY - nextPressStartY) > moveThreshold) onPressEnd('next');
            }
            if (prevLongPressTimer) {
                if (Math.abs(e.clientX - prevPressStartX) > moveThreshold || Math.abs(e.clientY - prevPressStartY) > moveThreshold) onPressEnd('prev');
            }
        }, { passive: true });
        imgContainer.addEventListener('pointerup', function(e) {
            const pointerEndX = e.clientX; const pointerEndY = e.clientY;
            const diffX = pointerStartX - pointerEndX;
            const diffY = pointerStartY - pointerEndY;
            const threshold = 50;
            if (Math.abs(diffX) > threshold && Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0) { nextImage(); } else { if (!hmActive) prevImage(); } lastTapTime = 0;
            } else if (Math.abs(diffY) <= 10 && Math.abs(diffX) <= threshold) {
                const currentTime = Date.now(); const tapLength = currentTime - lastTapTime;
                if (tapLength < 300 && tapLength > 0) { toggleTimer(); lastTapTime = 0; e.preventDefault(); }
                else { lastTapTime = currentTime; }
            }
        }, { passive: false });
        document.addEventListener('keydown', function(e) {
            armFocusIdleTimer();
            if (document.activeElement.tagName === 'SELECT' || document.activeElement.tagName === 'INPUT') return;
            if (e.code === 'Escape') {
                if (ui.managePopup.classList.contains('show')) { ui.managePopup.classList.remove('show'); return; }
                if (document.getElementById('settings-panel').classList.contains('open')) { toggleSettingsPanel(); return; }
                if (isHistoryPanelOpen) { toggleHistoryPanel(); return; }
            }
            if (e.code === 'Space') { e.preventDefault(); toggleTimer(); } 
            else if (e.code === 'ArrowRight') { nextImage(); } 
            else if (e.code === 'ArrowLeft') { prevImage(); }
        });
        document.addEventListener('pointerdown', function(e) {
            pointerStartX = e.clientX; pointerStartY = e.clientY; armFocusIdleTimer();
            if (!e.target.closest('#manage-popup') && !e.target.closest('#manage-btn')) { ui.managePopup.classList.remove('show'); }
        }, { passive: true });
    </script>
</body>
